<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#9588ff"><title>萌萌数学思考屋</title>
<style>
:root{--ink:#51465d;--muted:#84778e;--purple:#9182ff;--pink:#ff91bc;--mint:#d8f6eb;--line:#e9dff1;--good:#dcf7e8;--bad:#ffe6e6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(180deg,#faf8ff,#fffafd 58%,#fffdf7)}
button,input{font:inherit}.app{max-width:980px;margin:auto;min-height:100vh;padding:18px 18px 105px}.screen{display:none}.screen.active{display:block}
.hero,.card{background:white;border:2px solid #eee3f4;border-radius:28px;box-shadow:0 10px 28px rgba(125,105,160,.08)}.hero{padding:22px;background:linear-gradient(135deg,#efeaff,#ffe7f1)}
.badge{display:inline-block;background:white;border:1px solid #dfd5ff;color:#6e5fe3;border-radius:999px;padding:7px 12px;font-weight:900}
h1{font-size:34px;margin:8px 0}h2{font-size:25px;margin:0 0 10px}.sub{font-size:17px;line-height:1.7;color:var(--muted)}.card{padding:20px;margin-top:14px}
.unitgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.unit{border:2px solid #ece1f3;border-radius:23px;padding:18px;background:#fff}.unit.active{border-color:#a99cff;background:#f8f5ff}
.btn{border:0;border-radius:18px;padding:14px 18px;font-size:19px;font-weight:950;cursor:pointer}.primary{color:white;background:linear-gradient(135deg,#a494ff,#817eff)}.soft{background:#fff;border:2px solid var(--line);color:var(--ink)}.mint{background:var(--mint);color:#337463}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1}.progress{height:14px;background:#eee8f3;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#9d90ff,#ff99c5);width:0}
.topic{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed #ece2f0}.topic:last-child{border-bottom:0}.tag{font-size:12px;font-weight:900;border-radius:999px;padding:5px 8px;background:#f0ebff;color:#6a59d8}

.feedback{display:none;margin-top:12px;border-radius:16px;padding:11px;text-align:center;font-weight:900}.feedback.show{display:block}.good{background:var(--good);color:#2c7e4d}.bad{background:var(--bad);color:#c24e4e}

.small{font-size:13px;color:var(--muted)}.summarygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border:2px solid #eee3f3;border-radius:18px;padding:12px;text-align:center}.stat b{font-size:24px;display:block}

</style></head>
<body><div class="app">
<section id="home" class="screen active">
<div class="hero"><span class="badge">➗ 数学思考屋 · 试用版</span><h1>不怕难题，一步一步想 🌱</h1><div class="sub">第一、二单元先试用。这里不比谁做得快，而是练习：题目长一点、难一点，也愿意继续往下想。</div></div>
<div class="card"><h2>选择单元</h2><div class="unitgrid">
<div class="unit" id="u1card"><h2>1️⃣ 认识更大的数</h2><div class="sub">数位与计数单位 · 大数读写 · 比较 · 改写 · 近似数</div><button class="btn soft" style="margin-top:10px;width:100%" onclick="selectUnit(1)">进入第一单元</button></div>
<div class="unit active" id="u2card"><h2>2️⃣ 线与角</h2><div class="sub">线段/射线/直线 · 垂直与平行 · 角 · 量角与画角</div><button class="btn primary" style="margin-top:10px;width:100%" onclick="selectUnit(2)">正在学，先练这个</button></div>
</div></div>
<div class="card"><h2>今天的规则</h2><div class="tip">⭐ 简单题会做，不重复刷很多。<br>🌱 稍难题先找条件、再找问题、再想第一步。<br>🧩 卡住可以要提示，但提示后做出来也算进步。</div></div>
<div class="card"><a href="./index.html" style="text-decoration:none"><button class="btn soft">← 返回学习平台</button></a></div>
</section>

<section id="unit" class="screen">
<div class="card"><div class="row" style="align-items:center"><button class="btn soft" onclick="show('home')">←</button><div style="flex:3"><h2 id="unitTitle"></h2><div class="progress"><i id="unitProg"></i></div><div class="small" id="unitMeta"></div></div></div></div>
<div class="card"><h2>知识地图</h2><div id="topicList"></div></div>
<div class="row" style="margin-top:14px"><button class="btn primary" onclick="startSmart()">开始今天 6 题</button><button class="btn soft" onclick="startWeak()">只练不稳的</button></div>
</section>

<section id="quiz" class="screen">
<div class="card">
<div class="row" style="align-items:center"><button class="btn soft" onclick="show('unit')">退出</button><div class="small" id="qMeta"></div></div>
<div class="qicon" id="qIcon">🧠</div><div class="question" id="qText"></div>
<div id="guideBox"></div><div id="answerArea"></div><div id="fb" class="feedback"></div>
<div class="thinkbar" id="thinkbar">
<button class="think" onclick="needHelp(1)">🤔 我想一下</button><button class="think" onclick="needHelp(2)">🌱 给一点提示</button><button class="think" onclick="needHelp(3)">🧩 帮我拆一步</button>
</div>
</div>
</section>

<section id="report" class="screen">
<div class="card"><h2>妈妈查看</h2><div class="summarygrid"><div class="stat"><b id="rDone">0</b><span class="small">做过的题</span></div><div class="stat"><b id="rIndependent">0</b><span class="small">独立完成</span></div><div class="stat"><b id="rHelp">0</b><span class="small">提示后完成</span></div></div></div>
<div class="card"><h2>最值得关注</h2><div id="reportText" class="sub"></div></div>
<div class="card"><button class="btn soft" onclick="resetMath()">清空数学试用记录</button></div>
</section>
</div>
<nav><div class="inner"><button id="nav-home" class="active" onclick="show('home')">🏠<br>数学首页</button><button id="nav-unit" onclick="openCurrent()">🗺️<br>知识地图</button><button id="nav-quiz" onclick="startSmart()">🌱<br>今日训练</button><button id="nav-report" onclick="show('report')">👩‍👧<br>妈妈</button></div></nav>

]},

const KEY="mengmeng_math_v1";let S=JSON.parse(localStorage.getItem(KEY)||"{}");if(!S.meta)S.meta={unit:2};let session=[],qi=0,current=null,help=0;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function qstate(id){if(!S[id])S[id]={tries:0,wrong:0,independent:0,helped:0,bestHelp:9,last:0};return S[id]}
function selectUnit(u){S.meta.unit=u;save();openCurrent()}
function openCurrent(){renderUnit();show("unit")}
function renderUnit(){let u=BANK[S.meta.unit];unitTitle.textContent=u.title;let done=u.qs.filter(q=>qstate(q.id).independent||qstate(q.id).helped).length;unitProg.style.width=(done/u.qs.length*100)+"%";unitMeta.textContent="已练 "+done+" / "+u.qs.length+" 道试题";topicList.innerHTML="";u.topics.forEach(([k,n])=>{let qs=u.qs.filter(q=>q.t===k),ok=qs.filter(q=>qstate(q.id).independent).length,helped=qs.filter(q=>qstate(q.id).helped&&!qstate(q.id).independent).length;let status=ok===qs.length?"🟢 稳定":helped||ok?"🟡 学习中":"⚪ 未开始";topicList.innerHTML+='<div class="topic"><div><b>'+n+'</b><div class="small">'+qs.length+' 个训练点</div></div><span class="tag">'+status+"</span></div>"})}
function startSmart(){let u=BANK[S.meta.unit],unseen=u.qs.filter(q=>qstate(q.id).tries===0),weak=u.qs.filter(q=>qstate(q.id).wrong||qstate(q.id).helped&&!qstate(q.id).independent),easy=unseen.filter(q=>q.lv<=2),hard=unseen.filter(q=>q.lv===3);session=[...easy.slice(0,2),...weak.slice(0,2),...hard.slice(0,2)];if(session.length<6)session=[...new Map([...session,...u.qs].map(q=>[q.id,q])).values()].slice(0,6);begin()}
function startWeak(){let u=BANK[S.meta.unit];session=u.qs.filter(q=>{let s=qstate(q.id);return s.wrong||s.helped&&!s.independent}).slice(0,6);if(!session.length){alert("目前还没有明显薄弱题，先做今日训练吧～");return}begin()}
function begin(){qi=0;current=session[0];show("quiz");renderQ()}
function renderQ(){help=0;qMeta.textContent="第 "+(qi+1)+" / "+session.length+" 题 · "+(current.lv===1?"基础":current.lv===2?"小变式":"综合思考");qIcon.textContent=current.icon;qText.textContent=current.q;guideBox.innerHTML="";fb.className="feedback";thinkbar.style.display=current.lv===1?"none":"grid";renderAnswer()}
function renderAnswer(){
  const area=document.getElementById("answerArea");
  area.innerHTML="";
  if(current.type==="mc"){
    const box=document.createElement("div");
    box.className="options";
    current.o.forEach(o=>{
      const b=document.createElement("button");
      b.className="opt";
      b.textContent=o;
      b.addEventListener("click",()=>check(o));
      box.appendChild(b);
    });
    area.appendChild(box);
  }else{
    const input=document.createElement("input");
    input.id="ans";
    input.className="answer";
    input.inputMode="text";
    input.placeholder="输入答案";
    input.addEventListener("keydown",e=>{if(e.key==="Enter")check(input.value);});
    const btn=document.createElement("button");
    btn.className="btn primary";
    btn.style.width="100%";
    btn.style.marginTop="10px";
    btn.textContent="确定";
    btn.addEventListener("click",()=>check(input.value));
    area.appendChild(input);
    area.appendChild(btn);
  }
}
function clean(x){return String(x).trim().replace(/[，、;；]/g,",").replace(/\s*,\s*/g,",").replace(/\s+/g," ")}
function check(v){let s=qstate(current.id);s.tries++;s.last=Date.now();let ok=clean(v)===clean(current.a)||(current.alts||[]).some(a=>clean(v)===clean(a));if(ok){if(help===0){s.independent++;s.bestHelp=0}else{s.helped++;s.bestHelp=Math.min(s.bestHelp,help)}save();fb.className="feedback show good";fb.innerHTML=help===0?"🌟 独立做出来了！":"🌱 用了提示也坚持做出来了，这也很棒。";setTimeout(nextQ,700)}else{s.wrong++;save();fb.className="feedback show bad";fb.textContent="还没对，不急。先不要看答案，可以点“给一点提示”或“帮我拆一步”。"}}
function needHelp(level){help=Math.max(help,level);document.querySelectorAll(".think").forEach((b,i)=>b.classList.toggle("on",i<level));let txt=current.h[Math.min(level-1,current.h.length-1)];guideBox.innerHTML='<div class="tip" style="margin-top:12px"><b>'+(level===1?"先想这里":level===2?"提示":"拆一步")+"</b><br>"+txt+"</div>"}
function nextQ(){qi++;if(qi>=session.length){finish();return}current=session[qi];renderQ()}
function finish(){alert("今天这一小组完成啦！重点不是快，而是把难题想下去 🌱");openCurrent()}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));let n=document.getElementById("nav-"+id);if(n)n.classList.add("active");if(id==="report")renderReport()}
function renderReport(){let all=[...BANK[1].qs,...BANK[2].qs],used=all.filter(q=>qstate(q.id).tries),ind=used.filter(q=>qstate(q.id).independent).length,he=used.filter(q=>qstate(q.id).helped&&!qstate(q.id).independent).length;rDone.textContent=used.length;rIndependent.textContent=ind;rHelp.textContent=he;let deep=used.filter(q=>qstate(q.id).bestHelp>=3&&qstate(q.id).bestHelp<9).length,wrong=[...used].sort((a,b)=>qstate(b.id).wrong-qstate(a.id).wrong).slice(0,3);reportText.innerHTML="目前更值得看的是“是否愿意继续想”，而不只是正确率。<br><br>需要三级拆解提示的题：<b>"+deep+"</b> 道。<br>最近最容易卡住："+(wrong.length?wrong.map(q=>q.q).join("；"):"暂无明显记录")+"。"}
function resetMath(){if(confirm("确定清空数学试用记录吗？")){localStorage.removeItem(KEY);location.reload()}}
renderUnit();
