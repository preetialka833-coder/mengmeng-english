<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff9ecb"><title>萌萌学习花园</title>
<style>
:root{--ink:#594c67;--muted:#887d92;--pink:#ff91bd;--purple:#9484ff;--line:#f1deea}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff8fc,#f6f7ff 65%,#fffdf8)}
.wrap{max-width:920px;margin:auto;padding:28px 18px 70px}.hero{background:linear-gradient(135deg,#ffe2f0,#eeeaff);border:2px solid #f4deeb;border-radius:32px;padding:28px;box-shadow:0 12px 32px rgba(150,120,180,.09)}
.badge{display:inline-block;background:white;border:1px solid #ffd0e2;color:#dc5997;border-radius:999px;padding:8px 13px;font-weight:900}
h1{font-size:40px;margin:8px 0}.sub{font-size:18px;line-height:1.7;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.card{display:block;text-decoration:none;color:inherit;background:white;border:2px solid #f3e2ee;border-radius:28px;padding:24px;box-shadow:0 10px 28px rgba(150,120,180,.07)}
.card:active{transform:scale(.99)}.emoji{font-size:64px}.title{font-size:29px;font-weight:1000;margin:6px 0}.go{margin-top:18px;display:inline-block;padding:11px 16px;border-radius:16px;font-weight:950;color:white}
.eng .go{background:linear-gradient(135deg,#ff9bc8,#ff78b2)}.math .go{background:linear-gradient(135deg,#9d91ff,#7e8dff)}
.note{margin-top:18px;background:#fff;border:2px dashed #ecdceb;border-radius:22px;padding:17px;color:var(--muted);line-height:1.7}
@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:16px 12px}.hero{padding:20px}h1{font-size:31px}}
</style></head>
<body><main class="wrap">
<section class="hero"><span class="badge">🌸 希沃学习机 · 固定网址</span><h1>萌萌学习花园</h1><div class="sub">今天只做一点点。英语把学过的内容真正记住，数学把不会的题一步一步想下去。</div></section>
<section class="grid">
<a class="card eng" href="./english.html"><div class="emoji">🇬🇧🎀</div><div class="title">英语花园</div><div class="sub">单词 → 短语 → 句子 → 听写<br>继续保留现在的学习进度。</div><span class="go">去学英语 →</span></a>
<a class="card math" href="./math.html"><div class="emoji">➗🌟</div><div class="title">数学思考屋</div><div class="sub">第一、二单元试用版<br>基础 → 变式 → 拆解 → 综合。</div><span class="go">去学数学 →</span></a>
</section>
<div class="note">💡 先试用一周。数学这次不追求刷很多题，而是看她遇到稍难题时，能不能在提示下继续思考，而不是马上放弃。</div>
</main></body></html>
