<script>
var BANK=[{"id":"u2_01","k":"线","d":1,"t":"mc","q":"有两个端点、不能无限延伸的是哪一种线？","o":["线段","射线","直线"],"a":0,"h":["先想端点个数。","两个端点把长度限制住。","所以是线段。"]},{"id":"u2_02","k":"线","d":2,"t":"mc","q":"手电筒发出的光线更接近哪一种数学模型？","o":["线段","射线","直线"],"a":1,"h":["它有一个起点。","向一个方向延伸。","所以是射线。"]},{"id":"u2_03","k":"垂直","d":1,"t":"mc","q":"两条直线相交成直角时，这两条直线怎样？","o":["互相平行","互相垂直","只是相交"],"a":1,"h":["关键词是直角。","直角是90°。","相交成直角叫互相垂直。"]},{"id":"u2_04","k":"平行","d":2,"t":"mc","q":"同一平面内，两条永不相交的直线互相怎样？","o":["垂直","平行","重合"],"a":1,"h":["注意同一平面。","一直延伸也不相交。","这就是平行。"]},{"id":"u2_05","k":"角","d":1,"t":"text","q":"一条射线绕端点旋转半周形成的角是多少度？","a":"180","alts":["180°"],"h":["半周是半个圆。","一周360°。","半周180°。"]},{"id":"u2_06","k":"量角","d":3,"t":"text","q":"一条边对准量角器右侧0°刻度，另一条边经过60°和120°两个刻度。应该读多少度？","a":"60","alts":["60°"],"h":["先看从哪边0°开始。","题目说右侧0°。","因此读60°。"]},{"id":"u2_07","k":"线","d":1,"t":"mc","q":"没有端点、能向两个方向无限延伸的是？","o":["线段","射线","直线"],"a":2,"h":["想端点数量。","两个方向都无限延伸。","所以是直线。"]},{"id":"u2_08","k":"线","d":2,"t":"mc","q":"把一条线段的一端无限延长，得到的是？","o":["射线","直线","另一条线段"],"a":0,"h":["保留了一个端点。","另一个方向无限延伸。","这就是射线。"]},{"id":"u2_09","k":"平行","d":2,"t":"mc","q":"在同一平面内，与一条直线平行的两条直线之间可能相交吗？","o":["可能","不可能","有时可能"],"a":1,"h":["平行的定义就是永不相交。","同一平面是关键条件。","所以不可能。"]},{"id":"u2_10","k":"垂直","d":2,"t":"mc","q":"如果直线a垂直于直线b，直线c也垂直于直线b，那么a和c怎样？","o":["平行","垂直","一定相交"],"a":0,"h":["a和c都与同一条直线成90°。","它们方向相同。","因此a与c平行。"]},{"id":"u2_11","k":"角","d":1,"t":"mc","q":"90°的角是什么角？","o":["锐角","直角","钝角"],"a":1,"h":["直角的标准度数是90°。","不大也不小。","所以是直角。"]},{"id":"u2_12","k":"角","d":2,"t":"mc","q":"135°的角属于哪一类？","o":["锐角","直角","钝角"],"a":2,"h":["大于90°。","又小于180°。","所以是钝角。"]},{"id":"u2_13","k":"角","d":2,"t":"text","q":"周角是多少度？","a":"360","alts":["360°"],"h":["一整圈就是周角。","一整圈有360°。","所以是360°。"]},{"id":"u2_14","k":"角","d":2,"t":"text","q":"周角是平角的几倍？","a":"2","alts":["2倍"],"h":["平角180°。","周角360°。","360÷180=2。"]},{"id":"u2_15","k":"综合","d":3,"t":"text","q":"两条直线相交，其中一个角是35°，它相邻的角是多少度？","a":"145","alts":["145°"],"h":["相邻角合成平角。","平角180°。","180-35=145。"]},{"id":"u2_16","k":"综合","d":3,"t":"mc","q":"两条直线相交，其中一个角是90°。另外三个角怎样？","o":["都是90°","有两个90°一个180°","无法判断"],"a":0,"h":["相邻角和是180°。","180-90仍是90。","所以四个角全是90°。"]},{"id":"u2_17","k":"平行","d":3,"t":"mc","q":"经过直线外一点，可以画几条与这条直线平行的直线？","o":["1条","2条","无数条"],"a":0,"h":["位置和方向都受到限制。","在同一平面内有唯一性。","只能画1条。"]},{"id":"u2_18","k":"垂直","d":3,"t":"mc","q":"经过直线外一点，可以画几条与这条直线垂直的直线？","o":["1条","2条","无数条"],"a":0,"h":["垂线也有唯一性。","从一点到直线的垂线只有一条。","所以是1条。"]},{"id":"u2_19","k":"量角","d":2,"t":"mc","q":"用量角器量角时，角的顶点应该和量角器哪里重合？","o":["中心点","0°刻度","外圈任意位置"],"a":0,"h":["量角器围绕顶点读数。","先对中心。","所以顶点和中心点重合。"]},{"id":"u2_20","k":"量角","d":2,"t":"mc","q":"量角时，一条边已经对准0°线，下一步最重要的是？","o":["随便看一个刻度","沿对应的那圈刻度读另一边","把量角器移开"],"a":1,"h":["量角器有内外两圈刻度。","从对准的0°方向开始读。","因此要读对应那一圈。"]},{"id":"u2_21","k":"综合","d":3,"t":"mc","q":"一个角比直角大25°，它是多少度，属于什么角？","o":["65°，锐角","115°，钝角","205°，优角"],"a":1,"h":["直角90°。","90+25=115°。","115°是钝角。"]},{"id":"u2_22","k":"综合","d":3,"t":"text","q":"一个平角被分成两个角，其中一个是68°，另一个是多少度？","a":"112","alts":["112°"],"h":["平角180°。","两个角加起来180°。","180-68=112。"]},{"id":"u2_23","k":"变式","d":3,"t":"mc","q":"钟面上3时整，时针和分针形成的较小角是多少度？","o":["60°","90°","120°"],"a":1,"h":["3时整时分针指12，时针指3。","相邻两个数字间30°。","跨3格：30×3=90°。"]},{"id":"u2_24","k":"变式","d":3,"t":"mc","q":"一张长方形纸相邻两条边的位置关系是？","o":["平行","垂直","既不平行也不垂直"],"a":1,"h":["长方形四个角都是直角。","相邻边相交成90°。","因此相邻边互相垂直。"]}], SESSION=8, KEY="math-unit2_bank_stats_v1", stats={}, picked=[], done=0, score=0, tries={}, finished={};
function load(){try{stats=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){stats={};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(stats));}catch(e){}}
function st(id){if(!stats[id])stats[id]={ok:0,wrong:0,last:0};return stats[id];}
function dayDue(s){return !s.last || (Date.now()-s.last)>20*60*60*1000;}
function weight(q){var s=st(q.id),w=2+s.wrong*3;if(s.ok===0)w+=3;if(dayDue(s))w+=2;if(s.ok>=2)w-=2;if(w<1)w=1;return w;}
function choose(){var pool=[],i,j,w,q,exists;for(i=0;i<BANK.length;i++){w=weight(BANK[i]);for(j=0;j<w;j++)pool.push(BANK[i]);}
while(picked.length<SESSION&&pool.length){i=Math.floor(Math.random()*pool.length);q=pool[i];exists=false;for(j=0;j<picked.length;j++){if(picked[j].id===q.id)exists=true;}if(!exists)picked.push(q);for(j=pool.length-1;j>=0;j--){if(pool[j].id===q.id)pool.splice(j,1);}}
while(picked.length<SESSION&&picked.length<BANK.length){q=BANK[Math.floor(Math.random()*BANK.length)];exists=false;for(j=0;j<picked.length;j++)if(picked[j].id===q.id)exists=true;if(!exists)picked.push(q);}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function render(){var out="",i,j,q;for(i=0;i<picked.length;i++){q=picked[i];out+='<section class="card"><div><span class="num">第 '+(i+1)+' 题</span><span class="tag">'+esc(q.k)+' · '+(q.d===1?'基础':q.d===2?'变式':'挑战')+'</span></div><h2>'+esc(q.q)+'</h2>';if(q.t==="mc"){out+='<div class="opts">';for(j=0;j<q.o.length;j++)out+='<button class="opt" id="q'+i+'o'+j+'" onclick="checkMC('+i+','+j+');return false;">'+String.fromCharCode(65+j)+'. '+esc(q.o[j])+'</button>';out+='</div>';}else{out+='<div class="textrow"><input id="q'+i+'input" class="textans" type="text" placeholder="输入答案"><button class="checkbtn" onclick="checkText('+i+');return false;">检查答案</button></div>';}out+='<div id="fb'+i+'" class="feedback"></div><details><summary>🤔 提示 1</summary><div class="hint">'+esc(q.h[0])+'</div></details><details><summary>🌱 提示 2</summary><div class="hint">'+esc(q.h[1])+'</div></details><details><summary>🧩 帮我拆一步</summary><div class="hint">'+esc(q.h[2])+'</div></details></section>';}document.getElementById("questions").innerHTML=out;updateTop();renderMastery();}
function clean(s){return String(s).replace(/^\s+|\s+$/g,"").replace(/[,，\s]/g,"").replace(/度/g,"°");}
function addRewards(q){var xp=0,coins=0;try{xp=parseInt(localStorage.getItem("math_xp")||"0",10)||0;coins=parseInt(localStorage.getItem("math_coins")||"0",10)||0;localStorage.setItem("math_xp",String(xp+1));localStorage.setItem("math_coins",String(coins+q.d));}catch(e){}}
function markWrong(i){tries[i]=(tries[i]||0)+1;var s=st(picked[i].id);s.wrong++;s.ok=0;s.last=Date.now();save();renderMastery();}
function markDone(i){if(finished[i])return;finished[i]=true;done++;score++;var s=st(picked[i].id);if((tries[i]||0)===0)s.ok++;else s.ok=0;s.last=Date.now();save();addRewards(picked[i]);updateTop();renderMastery();if(done===picked.length)setTimeout(function(){alert("这一组完成啦！答对 "+score+" / "+picked.length+"。难题金币更多，做错过的题型以后还会回来。");},250);}
function checkMC(i,j){if(finished[i])return;var q=picked[i],fb=document.getElementById("fb"+i),k,b;for(k=0;k<q.o.length;k++){b=document.getElementById("q"+i+"o"+k);if(b)b.className="opt";}b=document.getElementById("q"+i+"o"+j);if(j===q.a){b.className="opt correct";fb.className="feedback good";fb.innerHTML="✅ 对啦！+"+q.d+" 金币";markDone(i);}else{b.className="opt wrong";fb.className="feedback bad";fb.innerHTML="❌ 还不对。先自己再想一下，需要时再打开提示。";markWrong(i);}}
function checkText(i){if(finished[i])return;var q=picked[i],v=clean(document.getElementById("q"+i+"input").value),ok=v===clean(q.a),j;if(!ok&&q.alts)for(j=0;j<q.alts.length;j++)if(v===clean(q.alts[j]))ok=true;var fb=document.getElementById("fb"+i);if(ok){fb.className="feedback good";fb.innerHTML="✅ 对啦！+"+q.d+" 金币";markDone(i);}else{fb.className="feedback bad";fb.innerHTML="❌ 还不对。先看题目条件，需要时再打开提示。";markWrong(i);}}
function updateTop(){document.getElementById("scoreText").innerHTML="本组得分："+score+" / "+picked.length;document.getElementById("doneText").innerHTML="已完成："+done+" / "+picked.length;}
function renderMastery(){var map={},i,q,s,key,out="<b>掌握地图：</b> ";for(i=0;i<BANK.length;i++){q=BANK[i];if(!map[q.k])map[q.k]={n:0,g:0};map[q.k].n++;s=st(q.id);if(s.ok>=2)map[q.k].g++;}for(key in map){out+=key+" "+(map[key].g===map[key].n?"🟢":map[key].g>0?"🟡":"⚪")+"　";}document.getElementById("mastery").innerHTML=out+'<br><span class="sub">同一题型连续独立做对 2 次才算稳定；答错后会提高以后抽中的概率。</span>';}
load();choose();render();
</script></body></html>
